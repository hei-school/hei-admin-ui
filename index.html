<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Scolarité de la Haute École d'Informatique de Madagascar"
    />
    <!-- Badge QR code (/badges/<public id>): hide the public id before Google Tag Manager
         reads the url, see publicIdOfBadgePath in src/operations/badges/badgeApi.ts -->
    <script>
      (function () {
        var path = /^\/badges\/([^/]+)\/?$/.exec(window.location.pathname);
        if (!path || path[1] === "scan" || path[1] === "attendance") return;
        var isPublicId =
          /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(
            path[1]
          );
        try {
          sessionStorage.setItem(
            "ha_badge_public_id",
            isPublicId ? path[1].toLowerCase() : ""
          );
        } catch (e) {}
        window.history.replaceState(window.history.state, "", "/badges");
      })();
    </script>
    <!-- Google Tag Manager -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({"gtm.start": new Date().getTime(), "event": "gtm.js"});
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != "dataLayer" ? "&l=" + l : "";
        j.async = true;
        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "GTM-KDJ6XHGS");
    </script>
    <!-- End Google Tag Manager -->
    <link rel="apple-touch-icon" href="/logo512.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>HEI Admin</title>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-KDJ6XHGS"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>Activez Javascript pour accéder à HEI Admin.</noscript>
  </body>
</html>
